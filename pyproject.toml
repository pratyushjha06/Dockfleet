[project]
name = "dockfleet"
version = "0.1.0"
dependencies = [
    "sqlmodel",
    "fastapi==0.110.0",
    "uvicorn==0.29.0",
    "jinja2==3.1.3",
    "pydantic",
    "pyyaml",
    "typer",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx<0.28"]

[project.scripts]
dockfleet = "dockfleet.cli.main:app"